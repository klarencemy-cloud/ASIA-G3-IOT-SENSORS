<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Group 3 IoT Dashboard</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>Group 3 IoT Dashboard</h1>
        <div class="status">
          <span class="dot" id="dot"></span>
          <span id="statusText">Connecting...</span>
        </div>
      </header>

      <div class="alarm clear" id="alarmBox">
        <span id="alarmText">Waiting for data...</span>
      </div>

      <div class="grid">
        <div class="card" id="cardTemp">
          <div class="label">Temperature</div>
          <div>
            <span class="value" id="temp">--</span><span class="unit">°C</span>
          </div>
        </div>
        <div class="card" id="cardHum">
          <div class="label">Humidity</div>
          <div>
            <span class="value" id="hum">--</span><span class="unit">%</span>
          </div>
        </div>
        <div class="card" id="cardDist">
          <div class="label">Distance</div>
          <div>
            <span class="value" id="dist">--</span
            ><span class="unit" id="distUnit">cm</span>
          </div>
        </div>
        <div class="card" id="cardWater">
          <div class="label">Water Sensor</div>
          <div><span class="value" id="water">--</span></div>
        </div>
        <div class="card" id="cardLight">
          <div class="label">Light Sensor</div>
          <div><span class="value" id="light">--</span></div>
        </div>
      </div>

      <div class="footer" id="footer">Last update: --</div>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
