<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Group 3 IoT Dashboard</title>
    <style>
      :root {
        --bg: #f4f6f8;
        --card: #ffffff;
        --text: #1b2430;
        --muted: #6b7684;
        --border: #e1e5ea;
        --ok: #1f9d55;
        --warn: #d9480f;
        --off: #868e96;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #12161c;
          --card: #1b222b;
          --text: #e8ecf1;
          --muted: #8b96a3;
          --border: #2b3440;
          --ok: #3ddc84;
          --warn: #ff7a45;
          --off: #7a8491;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px 16px 40px;
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      .wrap {
        max-width: 900px;
        margin: 0 auto;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 1.4rem;
        margin: 0;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 0.9rem;
        color: var(--muted);
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--off);
      }
      .dot.online {
        background: var(--ok);
      }
      .dot.offline {
        background: var(--warn);
      }

      .alarm {
        padding: 16px 20px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--card);
        margin-bottom: 20px;
        font-weight: 600;
        font-size: 1.05rem;
      }
      .alarm.active {
        border-color: var(--warn);
        color: var(--warn);
      }
      .alarm.clear {
        color: var(--ok);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 14px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 18px;
      }
      .card .label {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        margin-bottom: 8px;
      }
      .card .value {
        font-size: 1.9rem;
        font-weight: 700;
      }
      .card .unit {
        font-size: 1rem;
        font-weight: 500;
        color: var(--muted);
        margin-left: 4px;
      }
      .card.alert {
        border-color: var(--warn);
      }
      .card.alert .value {
        color: var(--warn);
      }
      .footer {
        margin-top: 22px;
        font-size: 0.8rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>Group 3 IoT Dashboard</h1>
        <div class="status">
          <span class="dot" id="dot"></span>
          <span id="statusText">Connecting...</span>
        </div>
      </header>

      <div class="alarm clear" id="alarmBox">
        <span id="alarmText">Waiting for data...</span>
      </div>

      <div class="grid">
        <div class="card" id="cardTemp">
          <div class="label">Temperature</div>
          <div>
            <span class="value" id="temp">--</span><span class="unit">°C</span>
          </div>
        </div>
        <div class="card" id="cardHum">
          <div class="label">Humidity</div>
          <div>
            <span class="value" id="hum">--</span><span class="unit">%</span>
          </div>
        </div>
        <div class="card" id="cardDist">
          <div class="label">Distance</div>
          <div>
            <span class="value" id="dist">--</span
            ><span class="unit" id="distUnit">cm</span>
          </div>
        </div>
        <div class="card" id="cardWater">
          <div class="label">Water Sensor</div>
          <div><span class="value" id="water">--</span></div>
        </div>
        <div class="card" id="cardLight">
          <div class="label">Light Sensor</div>
          <div><span class="value" id="light">--</span></div>
        </div>
      </div>

      <div class="footer" id="footer">Last update: --</div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import {
        getDatabase,
        ref,
        onValue,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

      const app = initializeApp({
        databaseURL:
          "https://esp32sensorsdata-4a025-default-rtdb.firebaseio.com",
      });
      const db = getDatabase(app);

      const $ = (id) => document.getElementById(id);
      const OFFLINE_AFTER_MS = 15000; // no new data for 15s = device offline
      let lastUpdate = 0;

      const alarmMessages = {
        WATER: "ALARM: Water detected",
        HIGH_TEMP: "ALARM: High temperature",
        DARK: "ALARM: Dark (low light)",
        OBJECT_CLOSE: "ALARM: Object too close",
        NONE: "All clear: no alarms",
      };

      function fmt(v, digits = 1) {
        return v === null || v === undefined ? "--" : Number(v).toFixed(digits);
      }

      onValue(ref(db, "sensors"), (snapshot) => {
        const d = snapshot.val();
        if (!d) return;

        lastUpdate = Date.now();

        // Numbers
        $("temp").textContent = fmt(d.temperature);
        $("hum").textContent = fmt(d.humidity);

        if (d.distance === null || d.distance === undefined) {
          $("dist").textContent = "No reading";
          $("distUnit").textContent = "";
        } else {
          $("dist").textContent = fmt(d.distance);
          $("distUnit").textContent = "cm";
        }

        // Water
        $("water").textContent = d.water ? "WATER DETECTED" : "Dry";
        $("cardWater").classList.toggle("alert", !!d.water);

        // Light
        $("light").textContent = d.dark ? "Dark" : "Bright";

        // Card highlights
        $("cardTemp").classList.toggle("alert", d.alarm === "HIGH_TEMP");
        $("cardDist").classList.toggle("alert", d.alarm === "OBJECT_CLOSE");
        $("cardLight").classList.toggle("alert", d.alarm === "DARK");

        // Alarm banner
        const alarm = d.alarm || "NONE";
        $("alarmText").textContent = alarmMessages[alarm] || alarm;
        $("alarmBox").className =
          "alarm " + (alarm === "NONE" ? "clear" : "active");

        $("footer").textContent =
          "Last update: " + new Date().toLocaleTimeString();
      });

      // Online/offline indicator
      setInterval(() => {
        const dot = $("dot");
        const text = $("statusText");

        if (!lastUpdate) {
          dot.className = "dot";
          text.textContent = "Waiting for device...";
          return;
        }

        if (Date.now() - lastUpdate > OFFLINE_AFTER_MS) {
          dot.className = "dot offline";
          text.textContent = "Device offline";
        } else {
          dot.className = "dot online";
          text.textContent = "Live";
        }
      }, 1000);
    </script>
  </body>
</html>
